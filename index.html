<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>策略回测</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #131722;
            color: #d1d4dc;
            font-family: -apple-system, BlinkMacSystemFont,
                "Segoe UI", "Microsoft YaHei", sans-serif;
        }

        header {
            height: 58px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #2a2e39;
            background: #1e222d;
        }

        .logo {
            color: #ffffff;
            font-size: 21px;
            font-weight: 700;
        }

        .subtitle {
            margin-left: 14px;
            color: #787b86;
            font-size: 13px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            border-bottom: 1px solid #2a2e39;
        }

        select, input, button {
            min-height: 36px;
            padding: 7px 10px;
            border: 1px solid #363a45;
            border-radius: 5px;
            background: #1e222d;
            color: #d1d4dc;
            font-size: 13px;
        }

        button {
            background: #2962ff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #1e53e5;
        }

        main {
            padding: 18px;
        }

        .section-title {
            margin: 0 0 14px;
            font-size: 15px;
            font-weight: 600;
        }

        .chart-panel {
            min-height: 320px;
            padding: 18px;
            background: #1e222d;
            border: 1px solid #2a2e39;
            border-radius: 6px;
        }

        .chart-placeholder {
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #363a45;
            color: #787b86;
            text-align: center;
            line-height: 2;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-top: 18px;
        }

        .stat-card {
            padding: 16px;
            background: #1e222d;
            border: 1px solid #2a2e39;
            border-radius: 6px;
        }

        .stat-label {
            color: #787b86;
            font-size: 12px;
        }

        .stat-value {
            margin-top: 10px;
            font-size: 22px;
            font-weight: 600;
        }

        .empty-panel {
            margin-top: 18px;
            padding: 22px;
            background: #1e222d;
            border: 1px solid #2a2e39;
            border-radius: 6px;
            color: #787b86;
            line-height: 1.8;
        }

        footer {
            padding: 20px;
            color: #5d606b;
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 650px) {
            header {
                padding: 0 14px;
            }

            .subtitle {
                margin-left: 8px;
                font-size: 11px;
            }

            main {
                padding: 12px;
            }

            .toolbar {
                padding: 12px;
                gap: 8px;
            }

            .stats {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .stat-value {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">策略回测</div>
        <div class="subtitle">量化交易研究平台</div>
    </header>

    <section class="toolbar">
        <label>
            交易品种
            <select id="symbol">
                <option>BTCUSDT</option>
                <option>ETHUSDT</option>
                <option>BNBUSDT</option>
            </select>
        </label>

        <label>
            K线周期
            <select id="timeframe">
                <option>1分钟</option>
                <option>5分钟</option>
                <option>15分钟</option>
                <option selected>1小时</option>
                <option>4小时</option>
                <option>1天</option>
            </select>
        </label>

        <label>
            初始资金
            <input id="capital" type="number"
                   value="10000" min="1" step="100">
        </label>

        <label>
            手续费（单边 %）
            <input id="fee" type="number"
                   value="0.1" min="0" step="0.01">
        </label>

        <button id="runButton">运行回测</button>
    </section>

    <main>
        <h2 class="section-title" id="chartTitle">
            BTCUSDT · 1小时
        </h2>

        <section class="chart-panel">
            <div class="chart-placeholder">
                <div>
                    <div>等待接入真实 K 线图表</div>
                    <div>下一阶段将接入交互式行情图</div>
                </div>
            </div>
        </section>

        <section class="stats">
            <div class="stat-card">
                <div class="stat-label">总收益率</div>
                <div class="stat-value" id="returnValue">--</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">最大回撤</div>
                <div class="stat-value" id="drawdownValue">--</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">胜率</div>
                <div class="stat-value" id="winRateValue">--</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">交易次数</div>
                <div class="stat-value" id="tradeCountValue">--</div>
            </div>
        </section>

        <section class="empty-panel" id="resultPanel">
            <h3>策略测试器</h3>
            <p>这里将展示策略回测结果、账户资金曲线和交易明细。</p>
            <p>当前版本尚未接入行情数据和回测计算引擎，暂不生成回测结果。</p>
        </section>
    </main>

    <footer>
        策略回测 · 量化研究工具
    </footer>

    <script>
        const symbol = document.getElementById("symbol");
        const timeframe = document.getElementById("timeframe");
        const chartTitle = document.getElementById("chartTitle");

        function updateTitle() {
            chartTitle.textContent =
                symbol.value + " · " + timeframe.value;
        }

        symbol.addEventListener("change", updateTitle);
        timeframe.addEventListener("change", updateTitle);

        document.getElementById("runButton").addEventListener("click", () => {
            const capital = Number(
                document.getElementById("capital").value
            );

            const fee = Number(
                document.getElementById("fee").value
            );

            if (!Number.isFinite(capital) || capital <= 0) {
                alert("请输入大于 0 的初始资金。");
                return;
            }

            if (!Number.isFinite(fee) || fee < 0) {
                alert("请输入有效的手续费率。");
                return;
            }

            alert(
                "界面设置已读取。\n" +
                "当前版本尚未接入回测引擎，暂时不会计算收益。\n" +
                "下一步将开发真实的策略回测功能。"
            );
        });
    </script>
</body>
</html>
